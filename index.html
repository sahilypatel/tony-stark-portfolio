<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Stark | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: none;
        }

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Base layer - Tony Stark (person without helmet) */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('tony-stark.jpg');
            background-size: auto 100%;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Reveal layer - Iron Man suit (with helmet - revealed by blob) */
        .hero-reveal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('iron-man.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;
            clip-path: url(#blob-mask);
            pointer-events: none;
        }

        /* SVG for clip-path mask */
        .svg-mask {
            position: absolute;
            width: 0;
            height: 0;
        }

        /* Content layer */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.85;
            letter-spacing: -0.02em;
            color: #000;
            transition: color 300ms ease;
        }

        .name span {
            display: block;
        }

        .projects-btn {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            color: #000;
            text-decoration: none;
            letter-spacing: 0.1em;
            transition: color 300ms ease;
            pointer-events: auto;
            cursor: none;
        }

        .projects-btn:hover {
            opacity: 0.7;
        }

        .bottom-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .social-icons {
            display: flex;
            gap: 25px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: color 300ms ease, opacity 300ms ease;
            pointer-events: auto;
            cursor: none;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        .social-icons svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Blob cursor */
        .blob-cursor {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
            transition: transform 50ms ease-out;
            mix-blend-mode: normal;
            background: transparent;
        }

        /* Trail blobs */
        .trail-blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            transform: translate(-50%, -50%);
            background: transparent;
        }

        /* Canvas for blob mask */
        #blob-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* White text state */
        .is-white {
            color: #fff !important;
        }

        .is-white svg {
            fill: #fff !important;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- Base layer - Tony Stark (person) -->
        <div class="hero-bg"></div>
        
        <!-- Reveal layer - Iron Man suit (blob reveals this) -->
        <canvas id="reveal-canvas"></canvas>
        
        <!-- Content -->
        <div class="content">
            <div class="top-row">
                <div class="name" data-hoverable>
                    <span>TONY</span>
                    <span>STARK</span>
                </div>
                <a href="#projects" class="projects-btn" data-hoverable>PROJECTS</a>
            </div>
            <div class="bottom-row">
                <div class="social-icons">
                    <a href="https://instagram.com/tonystark" target="_blank" rel="noopener" data-hoverable aria-label="Instagram">

                        </svg>
                    </a>
                    <a href="https://linkedin.com/in/tonystark" target="_blank" rel="noopener" data-hoverable aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            blobSize: 500,
            trailCount: 5,
            followDelay: 200,
            transitionDuration: 300,
            velocityThreshold: 2,
            trailFadeDelay: 30
        };

        // State
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let blobX = mouseX;
        let blobY = mouseY;
        let velocity = 0;
        let lastMouseX = mouseX;
        let lastMouseY = mouseY;
        let trails = [];
        let revealImage = null;
        let baseImage = null;

        // Canvas setup
        const revealCanvas = document.getElementById('reveal-canvas');
        const ctx = revealCanvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            revealCanvas.width = window.innerWidth;
            revealCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Load reveal image (Iron Man suit - helmet version)
        revealImage = new Image();
        revealImage.src = 'iron-man.jpg';

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Hoverable elements detection
        const hoverables = document.querySelectorAll('[data-hoverable]');

        function checkHoverableIntersection(blobX, blobY, blobRadius) {
            const elementsToCheck = [...hoverables, ...trails.map(t => t.element).filter(Boolean)];
            
            hoverables.forEach(el => {
                const rect = el.getBoundingClientRect();
                const elCenterX = rect.left + rect.width / 2;
                const elCenterY = rect.top + rect.height / 2;
                
                // Check main blob
                const distToMain = Math.sqrt(
                    Math.pow(blobX - elCenterX, 2) + 
                    Math.pow(blobY - elCenterY, 2)
                );
                
                // Check trail blobs
                let isInTrail = false;
                for (const trail of trails) {
                    if (trail.opacity > 0.1) {
                        const distToTrail = Math.sqrt(
                            Math.pow(trail.x - elCenterX, 2) + 
                            Math.pow(trail.y - elCenterY, 2)
                        );
                        if (distToTrail < trail.size / 2 + Math.max(rect.width, rect.height) / 2) {
                            isInTrail = true;
                            break;
                        }
                    }
                }
                
                const isOverlapping = distToMain < blobRadius + Math.max(rect.width, rect.height) / 2;
                
                if (isOverlapping || isInTrail) {
                    el.classList.add('is-white');
                } else {
                    el.classList.remove('is-white');
                }
            });
        }

        // Trail management
        function addTrail(x, y, size, opacity) {
            trails.push({
                x,
                y,
                size: size * (0.6 + Math.random() * 0.3),
                opacity,
                decay: 0.01 + Math.random() * 0.006
            });
            
            // Limit trail count
            if (trails.length > CONFIG.trailCount * 3) {
                trails = trails.slice(-CONFIG.trailCount * 2);
            }
        }

        // Animation loop
        let lastTime = 0;
        let trailTimer = 0;

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // Smooth follow with delay
            const ease = 1 - Math.pow(0.001, deltaTime / CONFIG.followDelay);
            blobX += (mouseX - blobX) * ease;
            blobY += (mouseY - blobY) * ease;
            
            // Calculate velocity
            const dx = mouseX - lastMouseX;
            const dy = mouseY - lastMouseY;
            velocity = Math.sqrt(dx * dx + dy * dy);
            lastMouseX = mouseX;
            lastMouseY = mouseY;
            
            // Add trail blobs when moving fast
            trailTimer += deltaTime;
            if (velocity > CONFIG.velocityThreshold && trailTimer > CONFIG.trailFadeDelay) {
                trailTimer = 0;
                const trailOpacity = Math.min(velocity / 30, 1);
                addTrail(blobX, blobY, CONFIG.blobSize, trailOpacity);
            }
            
            // Update trails
            trails = trails.filter(trail => {
                trail.opacity -= trail.decay;
                return trail.opacity > 0;
            });
            
            // Clear canvas
            ctx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
            
            // Draw reveal image with blob mask
            if (revealImage.complete) {
                // Calculate image scaling (matching CSS background-size: auto 100%, position: center)
                const imgRatio = revealImage.width / revealImage.height;
                
                let drawWidth, drawHeight, drawX, drawY;
                
                // Height matches viewport, width scales proportionally
                drawHeight = revealCanvas.height;
                drawWidth = revealCanvas.height * imgRatio;
                drawX = (revealCanvas.width - drawWidth) / 2; // Center horizontally
                drawY = 0;
                
                // Draw main blob with soft edges
                const mainGradient = ctx.createRadialGradient(
                    blobX, blobY, 0,
                    blobX, blobY, CONFIG.blobSize / 2
                );
                mainGradient.addColorStop(0, 'rgba(255,255,255,1)');
                mainGradient.addColorStop(0.7, 'rgba(255,255,255,1)');
                mainGradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = mainGradient;
                ctx.beginPath();
                ctx.arc(blobX, blobY, CONFIG.blobSize / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw trail blobs with soft edges
                trails.forEach(trail => {
                    const trailGradient = ctx.createRadialGradient(
                        trail.x, trail.y, 0,
                        trail.x, trail.y, trail.size / 2
                    );
                    trailGradient.addColorStop(0, `rgba(255,255,255,${trail.opacity})`);
                    trailGradient.addColorStop(0.6, `rgba(255,255,255,${trail.opacity * 0.8})`);
                    trailGradient.addColorStop(1, 'rgba(255,255,255,0)');
                    
                    ctx.fillStyle = trailGradient;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, trail.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Use the mask to reveal the image
                ctx.globalCompositeOperation = 'source-in';
                ctx.drawImage(revealImage, drawX, drawY, drawWidth, drawHeight);
            }
            
            // Check hoverable intersections
            checkHoverableIntersection(blobX, blobY, CONFIG.blobSize / 2);
            
            requestAnimationFrame(animate);
        }

        // Start animation when image is loaded
        revealImage.onload = () => {
            requestAnimationFrame(animate);
        };

        // Fallback if image is already cached
        if (revealImage.complete) {
            requestAnimationFrame(animate);
        }

        // Style the canvas
        revealCanvas.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        `;
    </script>
</body>
